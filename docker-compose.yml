services:
  transmitter:
    image: tinyops/transmitter:1.1.1
    environment:
      - LISTEN_ADDR=0.0.0.0:8080
      - TZ=Europe/Moscow
    env_file: .env
    restart: unless-stopped
    network_mode: host
    ports:
      - "8080:8080"
    healthcheck:
      test: ["CMD", "wget", "-qO-", "http://localhost:8080/api/health"]
      interval: 30s
      timeout: 5s
      retries: 3
    deploy:
      resources:
        limits:
          cpus: "1.0"
          memory: 64M
